name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CI: true
  NODE_ENV: test

jobs:
  # 1. Validación de Calidad (Linting)
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint Storefront
        run: pnpm --filter @dtc/storefront run lint
      
      - name: Lint Backend
        run: pnpm --filter @dtc/backend run lint

  # 2. Pruebas Unitarias e Integración (Con servicios)
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_DB: medusa, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Tests
        run: |
          cd apps/backend
          pnpm run test:unit
          pnpm run test:integration:http
          pnpm run test:integration:modules

  # 3. Validación de Build (Artefactos)
  build:
    name: Build & Artifact Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build Apps
        run: |
          pnpm --filter @dtc/backend run build
          pnpm --filter @dtc/storefront run build

  # 4. Validación de Contenedores
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull --tag medusa-ci:latest .